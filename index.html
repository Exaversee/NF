<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nouf - Purple Magic</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #05000a; 
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; 
        }
        #name-container {
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
        }
        .love-word {
            position: absolute;
            font-weight: bold;
            opacity: 0;
            white-space: nowrap;
            animation: fadeIn 0.8s forwards, float 3s ease-in-out infinite alternate;
            transform: translate(-50%, -50%);
            text-shadow: 0 0 8px rgba(180, 50, 255, 0.7); 
        }
        
        @keyframes fadeIn {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        
        @keyframes float {
            0% { margin-top: 0px; }
            100% { margin-top: -6px; }
        }
    </style>
</head>
<body>
    <div id="name-container"></div>

    <script>
        const phrases = [
            "I love you", "Te amo", "Je t'aime", "Ich liebe dich", 
            "Seni seviyorum", "Ti amo", "Я тебя люблю", "愛してる", 
            "사랑해", "Aku cinta kamu", "Mahal kita", "أنا أحبك"
        ];
        
        const container = document.getElementById('name-container');
        let points = [];
        let isMobile = window.innerWidth <= 768;

        function setupPoints() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            isMobile = window.innerWidth <= 768;
            
            // تصغير الخط في شاشات الجوال ليتناسب مع العرض دون اقتطاع
            let fontSize = isMobile ? window.innerWidth * 0.35 : Math.min(window.innerWidth * 0.35, window.innerHeight * 0.55);
            ctx.font = `900 ${fontSize}px 'Cairo', 'Arial Black', sans-serif`;

            ctx.fillText("نوف", canvas.width / 2, canvas.height / 2);

            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

            let step = isMobile ? 6 : 5;

            for (let y = 0; y < canvas.height; y += step) {
                for (let x = 0; x < canvas.width; x += step) {
                    const alpha = imgData[(y * canvas.width + x) * 4 + 3];
                    if (alpha > 128) {
                        points.push({x, y});
                    }
                }
            }
        }

        function drawName() {
            if (points.length === 0) return;

            let maxWords = isMobile ? 1200 : 2200;
            let wordsPerTick = isMobile ? 3 : 4;

            for(let i = 0; i < wordsPerTick; i++) {
                if(container.childNodes.length >= maxWords) return; 

                const randIndex = Math.floor(Math.random() * points.length);
                const point = points[randIndex];

                const jitterX = (Math.random() - 0.5) * (isMobile ? 6 : 12);
                const jitterY = (Math.random() - 0.5) * (isMobile ? 6 : 12);

                const word = document.createElement('span');
                word.className = 'love-word';
                word.innerText = phrases[Math.floor(Math.random() * phrases.length)];

                const fontSize = Math.random() * (isMobile ? 6 : 10) + (isMobile ? 5 : 6); 
                word.style.fontSize = `${fontSize}px`;

                const hue = Math.floor(Math.random() * 30) + 260;
                const saturation = Math.floor(Math.random() * 20) + 80; 
                const lightness = Math.floor(Math.random() * 25) + 60; 
                
                word.style.color = `hsl(${hue}, ${saturation}%, ${lightness}%)`;
                word.style.animationDelay = `0s, ${Math.random() * 2}s`;

                word.style.left = `${point.x + jitterX}px`;
                word.style.top = `${point.y + jitterY}px`;

                container.appendChild(word);
            }

            if (container.childNodes.length < maxWords) {
                setTimeout(drawName, isMobile ? 15 : 10); 
            }
        }

        document.fonts.ready.then(() => {
            setupPoints();
            drawName();
        });

        window.addEventListener('resize', () => {
            container.innerHTML = '';
            points = [];
            setupPoints();
            drawName();
        });
    </script>
</body>
</html>
